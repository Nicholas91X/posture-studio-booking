spring.application.name=posture_studio
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:posture_studio}
spring.datasource.username=${POSTGRES_USER:posture_studio}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# errors outside our controllers (unknown URL...) in the same ProblemDetail format
spring.mvc.problemdetails.enabled=true
# PROVISIONAL until step 9 (guide 20, part 5): the simulated "payment authorized", off unless the
# environment turns it on. Never true in production
booking.simulated-payments=${BOOKING_SIMULATED_PAYMENTS:false}
# the scheduled jobs of guide 21, on by default; false on a second instance of the application
booking.jobs.enabled=${BOOKING_JOBS_ENABLED:true}
# behind Caddy (D-017) the client is in X-Forwarded-For: Tomcat reads it only from a trusted proxy
# (private networks, such as Docker's), so getRemoteAddr() is the real client (guide 24, 6.4)
server.forward-headers-strategy=native

# ***** Email (step 8). Local: Mailpit (infra/docker-compose.dev.yml). The real provider: before step 14 *****
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# JavaMail waits forever by default: a mail server that hangs would hold the request with it
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${MAIL_FROM:no-reply@posture-studio.local}
# the address of the site, for the links in the emails (guide 27, 6.6); 3000 is the port of Next.js in development
notification.app-url=${APP_URL:http://localhost:3000}

# ***** Push notifications (guide 28, part 5) *****
# the VAPID key pair of this server, base64url, generated together with: java tools/GenerateVapidKeys.java
# The private key is a SECRET, no default: without the pair the application does not start (Vapid).
# Changing the pair invalidates every registered device (guide 28, 5.4)
notification.push.vapid.public-key=${VAPID_PUBLIC_KEY}
notification.push.vapid.private-key=${VAPID_PRIVATE_KEY}
# a contact for the push services (mailto: or https:); in production the studio's address
notification.push.vapid.subject=${VAPID_SUBJECT:mailto:no-reply@posture-studio.local}

# ***** SMS (guide 29, part 6) *****
# DEVELOPMENT ONLY: the SMS as emails to Mailpit (MailpitSmsCodeSender). Never true in production.
# With no SMS sender at all (no provider yet, an open point before step 14) the SMS APIs answer 503
notification.sms.mailpit=${SMS_TO_MAILPIT:false}

# ***** Access codes (guide 24) *****
# a SECRET, no default: without it the application does not start (LoginCodeHasher)
auth.login-code.hmac-key=${AUTH_CODE_HMAC_KEY}
# brakes on abuse (guide 24, part 6): per email, and per IP address (/64 network for IPv6)
auth.login-code.per-destination[0].max=3
auth.login-code.per-destination[0].window=PT15M
auth.login-code.per-destination[1].max=10
auth.login-code.per-destination[1].window=PT24H
auth.login-code.per-ip.max=30
auth.login-code.per-ip.window=PT1H
# only for SMS, which cost (guide 29, 5.2): the phone verifications one account may ask in a day, and the
# SMS that may leave in all in a day, whatever passed the limits above: a maximum to the expense
auth.login-code.sms.per-account.max=5
auth.login-code.sms.per-account.window=PT24H
auth.login-code.sms.sent.max=50
auth.login-code.sms.sent.window=PT24H

# ***** The first admin (guide 26, part 2) *****
# not a secret (signing in needs the code sent to this mailbox), but personal data: only in .env.
# Empty: nothing happens. Otherwise AdminBootstrap creates the ADMIN account at startup, if missing
auth.admin-email=${ADMIN_EMAIL:}

# ***** Sessions (guide 25, part 4) *****
# kept in PostgreSQL by Spring Session JDBC; the tables come from Flyway (V6), never from Spring
spring.session.jdbc.initialize-schema=never
# 30 days without requests and the session ends; every request moves the deadline forward.
# The absolute limit of 90 days from the sign-in is checked by SessionAccounts
spring.session.timeout=30d
# the cookie (HttpOnly, Secure, SameSite=Lax, Max-Age of 90 days) is declared in SessionCookieConfiguration,
# not with server.servlet.session.cookie.*: Boot applies those only with a real Tomcat, never in the tests
# no passwords in this system: no generated "user" with a password printed at startup
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
