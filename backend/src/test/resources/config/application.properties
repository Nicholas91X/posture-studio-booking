# Values for the tests only. Spring Boot reads classpath:/config/application.properties ON TOP of
# classpath:/application.properties (the main one, which stays in force): only what is here changes.

# The HMAC key of the access codes in the tests (guide 24, part 3). Public on purpose: it protects nothing.
# The real one is a secret, in .env (AUTH_CODE_HMAC_KEY)
auth.login-code.hmac-key=dGVzdC1vbmx5LWtleS1vZi10aGUtYWNjZXNzLWNvZGVzLTMyKw==

# The VAPID pair of the tests (guide 28, part 11): the application server keys of RFC 8291, Appendix A.
# Public on purpose: they protect nothing. The real ones are in .env (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY)
notification.push.vapid.public-key=BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8
notification.push.vapid.private-key=yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw

# Two fake payment accounts (guide 30, part 10): no test calls Stripe, the keys only need the right shape.
# Written as the environment variables would be: PaymentAccounts asks the Environment, which finds them here
payment.accounts=alpha,beta
STRIPE_ALPHA_SECRET_KEY=rk_test_alpha_not_a_real_key
STRIPE_ALPHA_WEBHOOK_SECRET=whsec_alpha_not_a_real_secret
STRIPE_BETA_SECRET_KEY=rk_test_beta_not_a_real_key
STRIPE_BETA_WEBHOOK_SECRET=whsec_beta_not_a_real_secret

# The tests must not depend on the .env of whoever runs them (application.properties imports ../.env, D-018).
# Found on 2026-11-10: with ADMIN_EMAIL in a developer's .env, AdminBootstrap created that admin in the test
# database too, and a test counting the users failed. Every value a .env could change, fixed here for the tests
auth.admin-email=
payment.live=false
notification.app-url=http://localhost:3000
payment.return-base-url=http://localhost:3000
notification.sms.mailpit=false
booking.jobs.enabled=true
# the OpenAPI contract (D-083) off, as in production, whatever OPENAPI_ENABLED says; OpenApiContractTest turns it on
springdoc.api-docs.enabled=false
